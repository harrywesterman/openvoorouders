name: Controles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q openvoorouders agent containers tools
      - run: bash -n install.sh bin/openvoorouders
      - run: find module containers/webtrees -type f \( -name '*.php' -o -name '*.phtml' \) -exec php -l {} \;
      - run: php -d zend.assertions=1 -d assert.exception=1 tests/family-start.php
      - run: python3 tools/prepare-build.py releases/candidate.json
      - run: npm ci --omit=dev
        working-directory: dist/build
      - run: python3 tools/check-opencode.py dist/build/node_modules/.bin/opencode
