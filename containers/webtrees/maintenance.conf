<Directory /var/www/webtrees>
  RewriteEngine On
  RewriteOptions InheritDownBefore
  # Health checks and startup migrations run over the container loopback only.
  RewriteCond %{REMOTE_ADDR} !^127\.0\.0\.1$
  RewriteCond %{REMOTE_ADDR} !^::1$
  RewriteCond /opt/ovo-control/maintenance.json -f
  RewriteCond expr "file('/opt/ovo-control/maintenance.json') =~ /enabled[^a-z]*true/"
  RewriteRule ^ - [R=503,L]
  ErrorDocument 503 "Openvoorouders wordt bijgewerkt. Probeer het straks opnieuw."
</Directory>
